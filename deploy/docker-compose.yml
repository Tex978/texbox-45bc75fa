# Synology Container Manager > Projekt > Létrehozás (projektnév: texbox).
# FONTOS: ugyanazon a gépen csak EGY TexBox fusson a 3050-es porton (a régi nas-vezerlo projektet állítsd le).
# A szolgáltatások címeit/kulcsait az app Kapcsolatok oldalán adhatod meg.
services:
  texbox:
    image: ghcr.io/tex978/texbox-45bc75fa:latest
    container_name: texbox
    restart: unless-stopped
    # host network: the blinds hub answers over local UDP (multicast), which bridge networking blocks
    network_mode: host
    volumes:
      # A forrás mappát előbb hozd létre a File Stationben (pl. /volume1/docker/texbox/data).
      # create_host_path:false → ha a mappa hiányzik, a konténer NEM indul el üres mappával.
      # Teljes, abszolút útvonalat is megadhatsz: source: /volume1/docker/texbox/data
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    environment:
      PORT: 3050
      DATA_DIR: /data
      DATA_FILE: /data/nas-state.json
      # Az első admin és az új, üres telepítés megerősítéséhez kell.
      APP_PASSWORD: valassz-egy-jelszot
      # Ajánlott: a data mappát ehhez a telepítéshez köti; más mappa csatolásakor a TexBox nem indul.
      # Egyszer válaszd meg, utána ne változtasd (nem titok, de ne is publikáld).
      # TEXBOX_INSTANCE_ID: otthon-texbox-1
      # Titkosítja a mentett kapcsolati adatokat. Őrizd meg külön (jelszókezelő); soha ne cseréld le.
      # TEXBOX_SECRET_KEY: ide-egy-hosszu-veletlen-ertek
      # SESSION_DAYS: 30
    labels:
      # Automatikus frissítés kikapcsolva: frissítés csak kézzel, előtte teljes data mentéssel.
      com.centurylinklabs.watchtower.enable: "false"
