# Synology Container Manager > Projekt > Létrehozás: ezt a fájlt add meg.
# Írd át az APP_PASSWORD értékét.
# A szolgáltatások címeit/kulcsait az app Kapcsolatok oldalán adhatod meg.
services:
  nas-vezerlo:
    image: ghcr.io/tex978/texbox-45bc75fa:latest
    container_name: nas-vezerlo
    restart: unless-stopped
    # host network: the blinds hub answers over local UDP (multicast), which bridge networking blocks
    network_mode: host
    volumes:
      - ./data:/data
    environment:
      PORT: 3050
      # Csak az első admin fiók létrehozásához kell (/__setup), utána mindenki saját fiókkal lép be.
      APP_PASSWORD: valassz-egy-jelszot
      # Titkosítja a mentett kapcsolati adatokat. Hozz létre egy hosszú véletlen értéket
      # (pl. jelszókezelővel), és őrizd meg külön is: nélküle a mentett adatok nem olvashatók.
      # TEXBOX_SECRET_KEY: ide-egy-hosszu-veletlen-ertek
      # SESSION_DAYS: 30
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Automatikus frissítés: 5 percenként megnézi, van-e új verzió.
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
